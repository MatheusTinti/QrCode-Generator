<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de QR Code da Focus Sul</title>
    <link rel="icon" type="image/png" href="LogoF.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .logo {
            position: fixed;
            top: 15px;
            left: 15px;
            height: 48px;
            width: auto;
            opacity: 0.9;
        }

        .container {
            text-align: center;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            width: 350px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .generate-btn {
            background-color: #4caf50;
            color: white;
        }

        .copy-btn {
            background-color: #2196f3;
            color: white;
            display: none;
            margin-left: 10px;
        }

        #qrcode {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <img src="LogoGrupo.png" class="logo" alt="Logo da Empresa">

    <div class="container">
        <h2>Gerar QR Code</h2>

        <input type="text" id="text" placeholder="Digite algo...">

        <br>

        <button class="generate-btn" onclick="generateQR()">Gerar</button>
        <button class="copy-btn" id="copyBtn" onclick="copyImage()">Copiar Imagem</button>

        <div id="qrcode"></div>
    </div>

    <script>
        function generateQR() {
            let text = document.getElementById("text").value;

            if (!text.trim()) return;

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: text,
                width: 200,
                height: 200
            });

            document.getElementById("copyBtn").style.display = "inline-block";
        }

        async function copyImage() {
            const canvas = document.querySelector("#qrcode canvas");
            if (!canvas) return;

            canvas.toBlob(async (blob) => {
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ "image/png": blob })
                    ]);
                    alert("Imagem copiada!");
                } catch {
                    alert("Erro ao copiar a imagem.");
                }
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

</body>
</html>
